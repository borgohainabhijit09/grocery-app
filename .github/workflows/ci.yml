name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: grocery
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d grocery"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/grocery
      DIRECT_URL: postgresql://postgres:password@localhost:5432/grocery
      NEXTAUTH_SECRET: ci-secret-ci-secret-ci-secret-1234
      AUTH_SECRET: ci-secret-ci-secret-ci-secret-1234
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Push schema to database
        run: npm run db:push

      - name: Seed database
        run: npm run db:seed

      - name: Build
        run: npm run build
